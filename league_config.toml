# League configuration for the 12th Week Campers draft bot.
# Data, not code: next season is an edit here, not a code change.

[league]
name = "12th Week Campers"
season = 2026
league_id = "1389692302259138560"
draft_id = "1389692302259138561"
teams = 12

# Prior drafts, used by later slices for price fitting and replay backtests.
[league.historical_drafts]
2025 = "1257407146123857920"
2024 = "1124814732579045377"
2023 = "992214922614067201"

[auction]
budget = 200
# Expected draft timers in seconds (league facts, GAMEPLAN.md); the
# settings-differ banner fires when the live draft contradicts them.
nomination_timer = 10
pick_timer = 10

# Drafted roster shape: 15 drafted slots (IR is extra, not drafted).
[roster]
QB = 1
RB = 2
WR = 2
TE = 1
FLEX = 1
K = 1
DEF = 1
BN = 6
IR = 2

[keeper]
cost_increment = 2        # keeper cost = prior winning bid + $2
cost_floor = 5            # minimum keeper cost
max_keepers = 3
max_consecutive_years = 2 # a player may be kept at most 2 years in a row

# Valuation-model tunables (decisions recorded in GAMEPLAN.md). Omitting
# any key, or the whole section, falls back to these same defaults.
[valuation]
band_ratio = 1.6       # ADP band spans adp/ratio .. adp*ratio, inclusive
min_band_samples = 6   # thinner bands fall back to the fitted log curve
gamma = 0.8            # per-season discount on the keeper option value
curve_cap = true       # cap curve prices at the position's max observed bid
# Worth is split across two replacement baselines: the last starter, and a
# deeper bench baseline read off this league's own 2023-25 draft composition.
# starter_pct is the share of the discretionary pool priced off the starter
# baseline; the rest prices off the bench baseline, so money keeps flowing
# past the starter cliff to the bench lots the room actually buys.
starter_pct = 0.5
# Depth target for the bench baseline, in skill lots league-wide. 0 means
# derive it from [roster] and teams: 12 * (15 drafted - 1 K - 1 DEF) = 156.
bench_skill_slots = 0

[me]
username = "firstrider55"
user_id = "868914670222921728"
roster_id = 7

[cache]
dir = "data/cache"
player_map_max_age_seconds = 86400

[http]
request_timeout_seconds = 15  # per-request timeout; tune lower for draft-night polling
